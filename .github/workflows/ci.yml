name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race -timeout 15m
      - name: build
        run: |
          go build ./...
          bash -n contrib/testnet.sh

  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VER="${GITHUB_SHA::12}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/laurent/freens/cmd/freens.version=$VER -X github.com/laurent/freens/cmd/freens-cli.cliVersion=$VER" -o dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/freens ./cmd/freens
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/laurent/freens/cmd/freens.version=$VER -X github.com/laurent/freens/cmd/freens-cli.cliVersion=$VER" -o dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/freens-cli ./cmd/freens-cli
      - uses: actions/upload-artifact@v4
        with:
          name: freens-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/
