name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        # -p 1: the packages run sequentially. In parallel, the 4-minute
        # cli -race suite starves the resolver's background-refresh timing
        # tests (AGENTS.md: the full-suite -race run oversubscribes the
        # CPU; flakes verified on unmodified master). Sequential keeps the
        # total inside the timeout and the timing tests honest.
        run: go test ./... -count=1 -race -timeout 15m -p 1
      - name: build
        run: |
          go build ./...
          bash -n contrib/testnet.sh

  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VER="${GITHUB_SHA::12}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VER -X main.cliVersion=$VER" -o dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/freens${{ matrix.ext }} ./cmd/freens
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VER -X main.cliVersion=$VER" -o dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/freens-cli${{ matrix.ext }} ./cmd/freens-cli
      - uses: actions/upload-artifact@v4
        with:
          name: freens-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/freens-${{ matrix.goos }}-${{ matrix.goarch }}/

  windows:
    # The windows goos side of the matrix above only proves it BUILDS; this
    # job also vets. The unit tests stay linux-only: several suites depend
    # on unix sockets/paths in ways the windows port deliberately does not
    # provide (the fleet's windows box exercises the real flows).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
