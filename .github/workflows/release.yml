name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build matrix
        run: |
          set -e
          VER="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            dir="dist/freens-${goos}-${goarch}"
            mkdir -p "$dir"
            LDFLAGS="-s -w -X main.version=$VER -X main.cliVersion=$VER"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" -o "$dir/freens" ./cmd/freens
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" -o "$dir/freens-cli" ./cmd/freens-cli
            tar -czf "dist/freens-${goos}-${goarch}.tar.gz" -C dist "freens-${goos}-${goarch}"
          done
          ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
