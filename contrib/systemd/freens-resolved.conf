# systemd-resolved drop-in for freens (spec §9.1 / §9.4 stage 1).
#
# Install as:
#   /etc/systemd/resolved.conf.d/freens.conf
# then:
#   systemctl restart systemd-resolved
#
# What this does:
#   DNS=127.0.0.1        resolved forwards every system lookup to the freens
#                        daemon on 127.0.0.1 (run the daemon on :53 via
#                        CAP_NET_BIND_SERVICE — see contrib/README.md — or
#                        keep it on :5300 and install contrib/port53-redirect.sh,
#                        which redirects resolved's outgoing :53 packets too).
#   DNSStubListener=no    frees resolved's own 127.0.0.53:53 listener so it
#                        cannot shadow or loop with the redirect rules, and
#                        makes 127.0.0.1 the only resolver path.
#
# Revert by deleting this file and restarting systemd-resolved.
#
# Coexistence note: applications querying 127.0.0.53 (the old stub address)
# keep working after DNSStubListener=no — they fail to connect and fall back
# to /etc/resolv.conf per glibc behavior; if that matters to you, keep the
# stub listener enabled instead (comment DNSStubListener out) and rely on the
# port-53 redirect to steer its upstream queries to the daemon.

[Resolve]
DNS=127.0.0.1
DNSStubListener=no
